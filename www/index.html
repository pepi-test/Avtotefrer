<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АвтоТефтер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical, a glovebox logbook you trust; short Bulgarian labels.
   IDEA: the Bulgarian registration plate + the windscreen inspection sticker.
   PICTURE: each vehicle is its own white EU plate; deadlines are sticker-like tiles that change colour.
   COLOUR and TYPE: asphalt band, plate white, EU blue #0a3a9e, signal amber/red for due dates; Golos Text + Roboto Condensed for plates and figures.
   LAYOUT: one column on phones, two on wide screens; floating + for a new record; bottom sheets for forms. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f3f0,#0e1115);--card:light-dark(#fff,#181c22);--ink:light-dark(#14171c,#eceef1);--mute:light-dark(#5d646e,#9aa2ad);
--line:light-dark(#e1e3df,#2a3039);--road:light-dark(#1d232b,#151a20);--eu:#0a3a9e;--eu2:light-dark(#0a3a9e,#7ea2ff);
--bad:light-dark(#c62d25,#ff6b61);--badbg:light-dark(#fdeceb,#3a1a19);--warn:light-dark(#b86e00,#ffb44a);--warnbg:light-dark(#fff3dd,#3a2b12);
--okbg:light-dark(#eef2fb,#18213a);--chip:light-dark(#eceeea,#232831)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Golos Text",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--eu2);outline-offset:2px}
.num,.plate b{font-family:"Roboto Condensed",system-ui,sans-serif}
.top{background:var(--road);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px) 22px}
.top{transition:background .4s}.top.bad{background:linear-gradient(160deg,#8f1d17,#4a0f0c)}.top.warn{background:linear-gradient(160deg,#8a5a00,#3d2a06)}
.beacon{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:99px;background:#ffffff22;color:#fff;font-weight:600;font-size:15px;border:0}
.beacon i{width:12px;height:12px;border-radius:50%;background:#ffd24a;box-shadow:0 0 0 0 #ffd24a99}.top.bad .beacon i{background:#ff6b61;box-shadow:0 0 0 0 #ff6b6199}
@media(prefers-reduced-motion:no-preference){.beacon i{animation:pulse 1.6s infinite}@keyframes pulse{70%{box-shadow:0 0 0 12px #0000}100%{box-shadow:0 0 0 0 #0000}}}
.vcard.card.bad{border:2px solid var(--bad)}.vcard.card.warn{border:2px solid var(--warn)}
.top .row{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.top h1{font-size:clamp(26px,6vw,36px);line-height:1.05;margin:0;font-weight:700;flex:1}
.top p{max-width:1100px;margin:8px auto 0;color:#c4cad3;font-size:15px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px)}
h2{font-size:20px;margin:26px 0 10px;line-height:1.2}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:2px solid #111;border-radius:6px;overflow:hidden;height:38px;box-shadow:0 1px 0 #0002;white-space:nowrap}
.plate .eu{background:var(--eu);color:#fff;width:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 2px;font:700 10px/1 "Roboto Condensed",sans-serif}
.plate .eu svg{width:15px;height:15px}
.plate b{font-size:23px;letter-spacing:1px;padding:0 10px;display:flex;align-items:center}
.plate.big{height:58px;border-width:3px}.plate.big .eu{width:32px;font-size:13px}.plate.big .eu svg{width:22px;height:22px}.plate.big b{font-size:clamp(28px,8vw,40px);padding:0 14px}
.plate.none b{color:#888;font-size:16px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.vcard{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.vcard .meta{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:15px}
.vcard h3{margin:0;font-size:18px;line-height:1.25}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--chip);white-space:nowrap}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--eu2)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left;min-height:60px}
.alert .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--warn)}.alert.bad .bar{background:var(--bad)}
.alert .t{flex:1}.alert .t b{display:block;font-size:16px}.alert .t span{color:var(--mute);font-size:14px}
.alert .d{font:700 20px/1 "Roboto Condensed",sans-serif;text-align:right;color:var(--warn);white-space:nowrap}.alert.bad .d{color:var(--bad)}
.alert .d small{display:block;font:500 12px "Golos Text",sans-serif;color:var(--mute);margin-top:3px}
.allok{display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--okbg);color:var(--eu2)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.hero h2{margin:0;font-size:clamp(22px,5vw,30px)}
.hero .sub{color:#c4cad3;font-size:15px;width:100%}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.st{border-radius:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;min-height:104px;position:relative}
.st .l{font-size:14px;color:var(--mute);font-weight:500}
.st .v{font:700 26px/1.1 "Roboto Condensed",sans-serif;margin-top:4px}
.st .s{font-size:13px;color:var(--mute)}
.st.ok{border-top:5px solid var(--eu2)}.st.warn{border-top:5px solid var(--warn);background:var(--warnbg)}.st.bad{border-top:5px solid var(--bad);background:var(--badbg)}.st.none{border-top:5px dashed var(--line)}
.st.warn .v{color:var(--warn)}.st.bad .v{color:var(--bad)}.st.none .v{font-size:17px;color:var(--mute);font-family:"Golos Text",system-ui,sans-serif}
.st.wide{grid-column:1/-1;min-height:0}
.meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--eu2)}
.st.warn .meter i{background:var(--warn)}.st.bad .meter i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 clamp(20px,5vw,26px)/1.1 "Roboto Condensed",sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mute)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;min-height:76px;justify-content:center;text-align:center}
.qb svg.i{width:26px;height:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;white-space:nowrap;min-height:40px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-top:0}
.rec .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.rec .tx{flex:1}.rec .tx b{display:block;font-weight:600}.rec .tx span{font-size:14px;color:var(--mute)}
.rec .am{font:700 18px "Roboto Condensed",sans-serif;white-space:nowrap;text-align:right}
.rec .am small{display:block;font:400 13px "Golos Text",system-ui,sans-serif;color:var(--mute)}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumbs img,.thumbs .pdf{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.pdf{display:grid;place-items:center;font-size:11px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--eu);border-color:var(--eu);color:#fff}
.btn.del{color:var(--bad)}
.btn.full{width:100%}
.empty{text-align:center;padding:40px 16px}
.empty p{color:var(--mute);max-width:36ch;margin:12px auto 20px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:20px;background:var(--eu);color:#fff;border:0;box-shadow:0 8px 24px #0a3a9e66;display:grid;place-items:center;z-index:5}
.fab svg{width:30px;height:30px}
.note{font-size:13px;color:var(--mute);margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note button{background:none;border:0;color:var(--eu2);text-decoration:underline;padding:8px 0;font-size:13px}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:#0009}
.panel{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.panel{border-radius:22px}}
.panel .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.panel h3{font-size:22px;margin:4px 0 14px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f>span{font-size:14px;font-weight:600;color:var(--mute)}
.f input,.f select,.f textarea{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px;font-weight:600;text-align:center;min-height:64px;justify-content:center}
.seg.sm{display:flex;overflow-x:auto;gap:6px;margin-bottom:16px;padding-bottom:4px}.seg.sm label{flex:none}.seg.sm span{flex-direction:row;min-height:44px;padding:8px 12px;gap:6px;font-size:14px}.seg.sm svg.i{width:18px;height:18px}
.seg input:checked+span{border-color:var(--eu2);box-shadow:inset 0 0 0 2px var(--eu2);color:var(--eu2)}
.seg input:focus-visible+span{outline:3px solid var(--eu2)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.chk input{width:22px;height:22px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts label{position:relative}.parts input{position:absolute;opacity:0}
.parts span{display:inline-block;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.parts input:checked+span{background:var(--ink);color:var(--bg)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:76px;height:76px}
.ph img,.ph .pdf{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.ph button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;line-height:1}
.ph.load{display:grid;place-items:center;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--mute)}
.phb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.actions .btn{flex:1}
.hint{font-size:13px;color:var(--mute);margin:-6px 0 14px}
.past:not(:empty){margin:-6px 0 14px;padding:10px 12px;border-radius:12px;background:var(--warnbg);color:var(--ink);font-size:14px}.past .btn{min-height:40px;padding:0 12px;margin:8px 8px 0 0;font-size:14px}
#viewer{position:fixed;inset:0;background:#000e;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#viewer button{position:absolute;top:14px;right:14px}
.snapin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}label.btn{cursor:pointer;position:relative;text-align:center}
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--eu);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.pend{border:1px dashed var(--eu2);border-radius:14px;padding:10px 12px;background:var(--okbg)}
.pend .actions{margin-top:8px}.pend .btn{min-height:40px}
.chatin{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.chatin textarea{flex:1;min-height:48px;max-height:140px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:12px;font-size:16px;resize:none}
@keyframes sp{to{transform:rotate(1turn)}}.spin{width:44px;height:44px;margin:auto;border-radius:50%;border:4px solid var(--line);border-top-color:var(--eu2);animation:sp 1s linear infinite}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:40;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.vehrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
@media(max-width:600px){.stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stats .stat:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="stars"><g fill="#ffd200"><circle cx="12" cy="4" r="1.3"/><circle cx="16" cy="5.1" r="1.3"/><circle cx="18.9" cy="8" r="1.3"/><circle cx="20" cy="12" r="1.3"/><circle cx="18.9" cy="16" r="1.3"/><circle cx="16" cy="18.9" r="1.3"/><circle cx="12" cy="20" r="1.3"/><circle cx="8" cy="18.9" r="1.3"/><circle cx="5.1" cy="16" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="5.1" cy="8" r="1.3"/><circle cx="8" cy="5.1" r="1.3"/></g></g>
</defs></svg>
<header class="top" id="top"></header>
<main id="app"><p class="hint">Зареждане…</p></main>
<button class="fab" id="fab" aria-label="Нов запис"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet" hidden><div class="scrim" data-close></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="viewer" hidden><img alt="Снимка на документ"><button class="btn" data-vclose>Затвори</button></div>
<div id="toast" role="status"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fFile" accept="image/*,application/pdf" multiple hidden>
<script src="native.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'—';
const days=s=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+'T00:00:00')-t)/864e5)};
const dn=n=>Math.abs(n)===1?'ден':'дни';
const nf=(n,d=0)=>Number(n||0).toLocaleString('bg-BG',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=n=>nf(n,2)+' €';
const km=n=>nf(n)+' км';
const I=p=>`<svg class="i" viewBox="0 0 24 24">${p}</svg>`;
const VT={car:['Лек автомобил','<path d="M3 16v-3l2.5-5h11L20 12l1 1v3z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>'],
moto:['Мотор','<circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16l4-6h5l4 6M12 10l-1-3H9M14.5 10l1.5-3h2"/>'],
van:['Бус','<path d="M2 17V7h12l4 4h4v6z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>'],
truck:['Камион','<path d="M2 16V5h11v11M13 9h5l3 4v3h-8"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>'],
other:['Друго','<rect x="3" y="7" width="18" height="9" rx="2"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/>']};
const DL=[['gtp','ГТП'],['go','Гражданска отговорност'],['kasko','Каско'],['vig','Винетка'],['mk','Маршрутна карта'],['tax','Данък МПС']];
const isHeavy=v=>v.heavy!=null?!!v.heavy:v.type==='truck';
const dlFor=v=>DL.filter(([k])=>v.type==='moto'&&(k==='vig'||k==='mk')?false:k==='mk'?isHeavy(v):k==='vig'?!isHeavy(v)||!!((v.dl||{}).vig):true);
const mkTime=v=>{const r=recsOf(v.id).find(r=>r.type==='ins'&&r.key==='mk');return r&&r.tm?' '+r.tm:''};
function mkEnd(v){const r=recsOf(v.id).find(r=>r.type==='ins'&&r.key==='mk');const s=(v.dl||{}).mk;if(!s)return null;if(r&&r.tm&&r.valid===s)return new Date(s+'T'+r.tm+':00');return new Date(s+'T23:59:59')}
const DLS={gtp:'ГТП',go:'Гражданска',kasko:'Каско',vig:'Винетка',mk:'Маршр. карта',tax:'Данък'};
const RT={fuel:['Гориво','#0a3a9e','<path d="M5 20V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v15M3.5 20h12M7 8h5M14 9h2a1 1 0 0 1 1 1v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>'],
oil:['Смяна на масло','#b86e00','<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>'],
service:['Ремонт / сервиз','#3d4651','<path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L4 16.7 7.3 20l5.3-5.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.5-.6-.6-2.5z"/>'],
tires:['Гуми','#5b6470','<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'],
ins:['ГТП / застраховка','#c62d25','<path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'],

function itemInfo(v,m){const last=recsOf(v.id).find(r=>(r.items||[]).includes(m.k));if(!last)return {m,s:'none'};

  if(im){const dt=new Date(last.date+'T00:00:00');dt.setMonth(dt.getMonth()+im);nd=iso(dt);dd=days(nd);if(used==null){const tot=(new Date(nd+'T00:00:00')-new Date(last.date+'T00:00:00'))/864e5;used=Math.min(1,Math.max(0,1-dd/tot))}}

function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>{if(b&&b.type==='image/webp'&&b.size<file.size)return res(b);c.toBlob(j=>j?res(j.size<file.size||!file.type.startsWith('image/jpeg')?j:file):rej(new Error('blob')),'image/jpeg',q)},'image/webp',q)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storePhoto(file){
  const isImg=file.type.startsWith('image/'),isPdf=file.type==='application/pdf';
  if(AS){const blob=isImg?await shrink(file,1400,.6):file;const r=await AS.upload(blob);return isPdf?{a:r.id,pdf:true}:{a:r.id}}
  if(!isImg)throw new Error('pdf');
  const data=await toData(await shrink(file,1000,.5)),id=gid();
  if(DB){await G.collection('photos').doc(id).set({data});PC[id]=data;return {p:id}}
  if(!LS.set('garaj-ph-'+id,data))throw new Error('full');PC[id]=data;return {l:id};
}

function phHTML(p,cls=''){if(p.pdf)return `<span class="pdf ${cls}" data-open="${esc(p.a)}">PDF</span>`;const s=phSrc(p);return `<img class="${cls}" alt="Документ" loading="lazy" ${s?`src="${esc(s)}"`:`data-lazy="${esc(p.p||'')}"`} data-full="1">`}

/* ---------- logic ---------- */
const recsOf=vid=>S.records.filter(r=>r.vid===vid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(+b.km||0)-(+a.km||0));
const curKm=v=>Math.max(+v.km||0,...S.records.filter(r=>r.vid===v.id).map(r=>+r.km||0));
function st(d){if(d==null)return 'none';if(d<=14)return 'bad';if(d<=45)return 'warn';return 'ok'}
const shM=(s,m)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+m);return iso(d)};
function instInfo(v,k){if(k!=='go'&&k!=='kasko')return null;const end=(v.dl||{})[k];if(!end)return null;const r=recsOf(v.id).find(r=>r.type==='ins'&&r.key===k&&r.valid===end);if(!r||!(+r.inst>1))return null;
  const n=+r.inst,p=Math.max(1,Math.min(n,+r.paid||1));if(p>=n)return {r,n,p,done:true};const due=shM(r.date,p*12/n),d=days(due);return {r,n,p,due,d,s:st(d)}}
function dlInfo(v,k){const s=v.dl&&v.dl[k];if(!s)return {k,s:'none'};const d=days(s);if(k==='mk'){const e=mkEnd(v);return e&&e<new Date()?{k,s:'none',exp:true,date:s}:{k,date:s,d,s:'ok'}}return {k,date:s,d,s:st(d)}}
function oilInfo(v){
  const last=recsOf(v.id).find(r=>r.type==='oil');if(!last)return {s:'none'};
  const ik=+v.oilKm||10000,im=+v.oilMonths||12,ck=curKm(v);
  const nextKm=(+last.km||0)+ik,dt=new Date(last.date+'T00:00:00');dt.setMonth(dt.getMonth()+im);const nd=iso(dt),dd=days(nd);
  const left=last.km?nextKm-ck:null,used=last.km?Math.min(1,Math.max(0,(ck-last.km)/ik)):null;
  let s='ok';if((left!=null&&left<0)||dd<0)s='bad';else if((left!=null&&left<=1000)||dd<=30)s='warn';

function dueText(d){return d<0?`изтекла преди ${-d} ${dn(d)}`:d===0?'изтича днес':`остават ${d} ${dn(d)}`}
function alerts(){const out=[];for(const v of S.vehicles){for(const[k,l]of dlFor(v)){const x=dlInfo(v,k);if(x.s==='bad'||x.s==='warn')out.push({v,l,s:x.s,d:x.d,sub:`до ${fmtD(x.date)}`,big:x.d<0?'Изтекла':x.d+' '+dn(x.d)})}
{const fs=fuelStats(v.id);if(fs.meas.length>=3&&fs.last){const prevAvg=(()=>{const m=fs.meas.slice(0,-1),l=m.reduce((s,x)=>s+x.l,0),d=m.reduce((s,x)=>s+x.dist,0);return d?l/d*100:null})();if(prevAvg&&fs.last.c>prevAvg*1.2)out.push({v,l:'Повишен разход на гориво',s:'warn',d:999,sub:nf(fs.last.c,1)+' л/100 км при средно '+nf(prevAvg,1)+' — проверете гуми, филтри, стил на каране',big:'+'+Math.round((fs.last.c/prevAvg-1)*100)+'%'})}}

const o=oilInfo(v);if(o.s==='bad'||o.s==='warn'){const byKm=o.left!=null&&(o.left<=1000);out.push({v,l:'Смяна на масло',s:o.s,d:byKm?Math.min(o.dd,o.left/50):o.dd,sub:o.left!=null?`при ${km(o.nextKm)} или до ${fmtD(o.nd)}`:`до ${fmtD(o.nd)}`,big:o.left!=null&&byKm?(o.left<0?'Просрочена':km(o.left)):(o.dd<0?'Просрочена':o.dd+' '+dn(o.dd))})}}

function fuelStats(vid){const f=S.records.filter(r=>r.vid===vid&&r.type==='fuel'&&+r.km>0&&+r.liters>0).sort((a,b)=>a.km-b.km||String(a.date).localeCompare(String(b.date)));
  const per={},meas=[];let prev=null,acc=0;

    if(prev){acc+=+r.liters;if(r.full!==false){const dist=r.km-prev.km;if(dist>0){const c=acc/dist*100;if(c>1&&c<80){per[r.id].cons=c;meas.push({id:r.id,c,dist,l:acc})}}prev=r;acc=0}}
    else if(r.full!==false)prev=r}

  if(!form||form.kind!=='busy')return;

  form.aiMsg=(n?plateWarn+'Разпознах: '+(type==='ins'?(DL.find(d=>d[0]===r.key)||['',RT.ins[0]])[1]:RT[type][0])+(S.vehicles.length>1?' за '+(v.plate||vname(v)):'')+'. Проверете полетата и натиснете „Запази“.':'Не открих данни. Попълнете ръчно или опитайте с по-ясна снимка.');

function summaryHTML(recs){recs=recs.filter(r=>r&&r.type!=='fuel').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(!recs.length)return '';
  const when=r=>fmtD(String(r.date||''))+(+r.km?' · '+km(+r.km):'');const rows=[];
  const oil=recs.find(r=>r.type==='oil');if(oil)rows.push(['Масло двигател',when(oil)+(oil.title?' · '+oil.title:'')]);
  const seen={};for(const r of recs){for(const l of (Array.isArray(r.itemsL)?r.itemsL:[]))if(typeof l==='string'&&!seen[l]){seen[l]=1;rows.push([l,when(r)])}}
  const tir=recs.find(r=>r.type==='tires');if(tir)rows.push(['Гуми',when(tir)+(tir.title?' · '+tir.title:'')]);
  const gtp=recs.find(r=>r.type==='ins'&&r.key==='gtp');if(gtp)rows.push(['ГТП',fmtD(String(gtp.date||''))+(gtp.valid?' · валидно до '+fmtD(String(gtp.valid)):'')]);
  const rep=recs.filter(r=>r.type==='service'&&!(Array.isArray(r.itemsL)&&r.itemsL.length&&r.title===r.itemsL.join(', ')));
  const kms=recs.map(r=>+r.km).filter(x=>x>0),dts=recs.map(r=>String(r.date||'')).filter(Boolean).sort();
  return `<div class="card" style="margin-top:10px"><b style="font-size:17px">Накратко</b>
  <p class="hint" style="margin:4px 0 10px">${recs.length} записа${dts.length?' от '+fmtD(dts[0])+' до '+fmtD(dts[dts.length-1]):''}${kms.length>1?' · '+km(Math.min(...kms))+' – '+km(Math.max(...kms)):''}${rep.length?' · '+rep.length+' ремонта':''}</p>
  <table style="width:100%;border-collapse:collapse;font-size:15px">${rows.map(([a,b])=>`<tr><td style="padding:7px 8px 7px 0;border-top:1px solid var(--line);color:var(--mute);vertical-align:top;width:42%">${esc(a)}</td><td style="padding:7px 0;border-top:1px solid var(--line)">${esc(b)}</td></tr>`).join('')}</table>
  ${rep.length?`<p style="margin:12px 0 4px;font-weight:600">Ремонти</p><ul style="margin:0;padding-left:18px">${rep.slice(0,8).map(r=>`<li>${esc(r.title||'Ремонт')} <span class="hint">${esc(when(r))}</span></li>`).join('')}</ul>${rep.length>8?`<p class="hint" style="margin:4px 0 0">и още ${rep.length-8} — вижте пълната история по-долу.</p>`:''}`:''}</div>`}

    case 'copy':{const txt=JSON.stringify({app:'garaj',v:1,vehicles:S.vehicles,records:S.records.map(r=>({...r,photos:[]}))});try{await navigator.clipboard.writeText(txt);toast('Копирано.')}catch(err){$('#panel [name=imp]').value=txt;toast('Маркирайте текста в полето и го копирайте.')}}break;
    case 'imp':{try{const o=JSON.parse(val('imp'));if(!Array.isArray(o.vehicles))throw 0;closeSheet();for(const v of o.vehicles)await putV(v);for(const r of o.records||[])await putR(r);toast('Възстановени '+o.vehicles.length+' превозни средства.')}catch(err){toast('Текстът не е валидно резервно копие.')}}break;
  }
});
document.addEventListener('change',e=>{const t=e.target;if(form&&form.kind==='veh'&&t.name==='type'){const h=$('#panel [name=heavy]');if(h)h.checked=t.value==='truck'}if(!form||form.kind!=='rec')return;
  if(t.name==='rtype'){keepRec();form.r.type=t.value;drawRec()}
  if(t.name==='vid'){form.r.vid=t.value}
  if(t.name==='inst'||t.name==='paid'){keepRec();drawRec()}
  if(t.name==='key'){keepRec();if(PER[t.value]){if(!PER[t.value].some(x=>x[0]===form.r.vtype))form.r.vtype=t.value==='mk'?'day':'year'}drawRec();if(PER[t.value])vigCalc()}
  if((t.name==='vtype'||t.name==='date')&&form.r.type==='ins'&&PER[val('key')])vigCalc()});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#panel')&&e.target.type==='date')pastCheck();if(!form||form.r?.type!=='fuel')return;const n=e.target.name;if(!['liters','price','cost'].includes(n))return;
  const L=parseFloat(val('liters').replace(',','.')),P=parseFloat(val('price').replace(',','.')),C=$('#panel [name=cost]');
  if((n==='liters'||n==='price')&&L>0&&P>0)C.value=(L*P).toFixed(2)});
async function onFiles(e){const files=[...e.target.files];e.target.value='';if((snapMode==='odo'||snapMode==='rcpt'||snapMode==='doc')&&form&&form.kind==='rec'){const m=snapMode;snapMode=null;const f=files.find(f=>f.type.startsWith('image/'));if(f)(m==='odo'?odoFlow(f):m==='doc'?docFlow(f):rcptFlow(f));return}if(snapMode){const im=files.filter(f=>f.type.startsWith('image/'));const f=im[0];if(f)snapFlow(f,im.slice(1,3));else{snapMode=null;toast('Изберете снимка.')}return}if(!form)return;
  for(const f of files){form.up=true;$('#phs')&&($('#phs').innerHTML=phEdit());
    try{form.r.photos.push(await storePhoto(f));if(f.type.startsWith('image/'))(form.blobs=form.blobs||[]).push(f)}catch(err){toast(err.message==='pdf'?'PDF може да се добави само от собственика на приложението.':err.message==='full'?'Няма място на устройството за снимката.':'Снимката не се качи. Опитайте пак.')}
    form.up=false;if(form&&$('#phs'))$('#phs').innerHTML=phEdit()}}
document.addEventListener('change',e=>{const t=e.target;if(!t.classList||!t.classList.contains('snapin'))return;const m=t.closest('[data-snapm]').dataset.snapm;
  if(form&&form.kind==='rec')keepRec();snapMode={doc:'doc',rcpt:'rcpt',odo:'odo',snapCam:'any',snapFile:'any',snapReg:'reg',cam:null,file:null}[m];onFiles(e)});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('impin')&&t.files&&t.files[0]){const f=t.files[0];t.value='';readImport(f)}});
$('#fCam').addEventListener('change',onFiles);$('#fFile').addEventListener('change',onFiles);
$('#fab').addEventListener('click',()=>S.ready&&snapMenu());
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='chatq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const q=e.target,t=q.value;q.value='';chatSend(t);return}if(e.key==='Escape'){if(!$('#viewer').hidden)$('#viewer').hidden=true;else if(!$('#sheet').hidden)closeSheet()}});
$('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')$('#viewer').hidden=true});
window.addEventListener('hashchange',()=>{if(/^#vin-/.test(location.hash)){checkVinHash();return}const m=location.hash.match(/^#v-([a-z0-9]+)$/);S.vid=m?m[1]:null;render()});
{const m=location.hash.match(/^#v-([a-z0-9]+)$/);if(m)S.vid=m[1]}

/* ---------- device (phone) ---------- */
const b64ToBlob=(b64,type)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
const extOf=t=>t==='image/webp'?'.webp':t==='image/png'?'.png':t==='application/pdf'?'.pdf':'.jpg';
const mimeOf=n=>/\.webp$/.test(n)?'image/webp':/\.png$/.test(n)?'image/png':/\.pdf$/.test(n)?'application/pdf':'image/jpeg';
const DEV={
  upload:async blob=>{const id=gid()+extOf(blob.type);const data=(await toData(blob)).split(',')[1];await N.Filesystem.writeFile({path:'p/'+id,data,directory:N.Directory.Data,recursive:true});return {id}},
  delete:async id=>{await N.Filesystem.deleteFile({path:'p/'+id,directory:N.Directory.Data})},
  list:async()=>{try{const r=await N.Filesystem.readdir({path:'p',directory:N.Directory.Data});return {assets:(r.files||[]).map(f=>({id:f.name,sizeBytes:f.size||0}))}}catch(e){return {assets:[]}}}};
async function photoData(p){try{if(p.a&&N){const r=await N.Filesystem.readFile({path:'p/'+p.a,directory:N.Directory.Data});return 'data:'+mimeOf(p.a)+';base64,'+r.data}const s=phSrc(p);if(s.startsWith('data:'))return s;if(s){const b=await (await fetch(s)).blob();return await toData(b)}}catch(e){}return ''}
async function shareFile(name,content,title,text){
  if(N){const w=await N.Filesystem.writeFile({path:name,data:content,directory:N.Directory.Cache,encoding:N.Encoding.UTF8});await N.Share.share({title,text,files:[w.uri],dialogTitle:title});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
/* on-device text recognition (free, offline) */
async function ocr(blob){if(!N||!N.TextRecognition)throw {code:'ocr_unavailable'};const name='ocr_'+gid()+extOf(blob.type);
  const w=await N.Filesystem.writeFile({path:name,data:(await toData(blob)).split(',')[1],directory:N.Directory.Cache});
  try{const r=await N.TextRecognition.processImage({path:w.uri});return r.text||''}finally{N.Filesystem.deleteFile({path:name,directory:N.Directory.Cache}).catch(()=>{})}}
/* notifications */
let nT=null;
function scheduleNotifs(){if(!N)return;clearTimeout(nT);nT=setTimeout(async()=>{try{const LN=N.LocalNotifications;const p=await LN.checkPermissions();if(p.display!=='granted')return;
  const pend=await LN.getPending();if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const now=new Date(),list=[];let id=1;
  for(const it of remItems()){if(!it.due)continue;for(const off of [14,7]){const at=new Date(it.due+'T09:00:00');at.setDate(at.getDate()-off);if(at<=now)continue;
    list.push({id:id++,title:it.w+' · '+it.v,body:off===0?'Изтича днес ('+fmtD(it.due)+')':'Изтича след '+off+' '+dn(off)+' — на '+fmtD(it.due),schedule:{at,allowWhileIdle:true},smallIcon:'ic_stat_car',iconColor:'#0A3A9E'})}}
  list.sort((a,b)=>a.schedule.at-b.schedule.at);if(list.length)await LN.schedule({notifications:list.slice(0,60)})}catch(e){}},800)}
async function notifPermission(ask){if(!N)return 'none';try{const LN=N.LocalNotifications;let p=await LN.checkPermissions();if(p.display!=='granted'&&ask)p=await LN.requestPermissions();if(p.display==='granted')scheduleNotifs();return p.display}catch(e){return 'error'}}
/* camera / gallery through the phone */
const SNAPMAP={doc:'doc',rcpt:'rcpt',odo:'odo',snapCam:'any',snapFile:'any',snapReg:'reg',cam:null,file:null};
document.addEventListener('click',async e=>{const l=e.target.closest&&e.target.closest('label[data-snapm]');if(!l||!N)return;e.preventDefault();e.stopPropagation();const m=l.dataset.snapm,gallery=(m==='snapFile'||m==='file');
  try{const files=[];
    if(gallery){const r=await N.Camera.pickImages({quality:85,limit:m==='snapFile'?3:5});for(const ph of r.photos||[]){const f=await N.Filesystem.readFile({path:ph.path});files.push(b64ToBlob(f.data,'image/'+(ph.format==='png'?'png':'jpeg')))}}
    else{const ph=await N.Camera.getPhoto({quality:85,resultType:N.CameraResultType.Base64,source:N.CameraSource.Camera,width:2400,correctOrientation:true,saveToGallery:false});files.push(b64ToBlob(ph.base64String,'image/'+(ph.format==='png'?'png':'jpeg')))}
    if(!files.length)return;if(form&&form.kind==='rec')keepRec();snapMode=SNAPMAP[m];onFiles({target:{files,value:''}})}
  catch(err){const msg=String((err&&err.message)||err||'');if(!/cancel|No image picked|User denied/i.test(msg))toast('Камерата не се отвори: '+msg)}},true);
/* ---------- boot ---------- */
async function boot(){S.mode='local';
  if(N){try{DATAURI=(await N.Filesystem.getUri({path:'',directory:N.Directory.Data})).uri.replace(/\/$/,'')}catch(e){}
    AS=DEV;if(N.TextRecognition)SAMPLE={ocr:true};
    let d=null;try{const r=await N.Filesystem.readFile({path:'data.json',directory:N.Directory.Data,encoding:N.Encoding.UTF8});d=JSON.parse(r.data)}catch(e){}
    if(!d)d=LS.get('garaj-data',null);d=d||{vehicles:[],records:[]};S.vehicles=d.vehicles||[];S.records=d.records||[];
    N.App.addListener('backButton',()=>{if(!$('#viewer').hidden)$('#viewer').hidden=true;else if(!$('#sheet').hidden)closeSheet();else if(S.vid)go(null);else N.App.exitApp()});
    N.App.addListener('pause',()=>{saveNow()});
    N.App.addListener('resume',()=>{render()})}
  else{const d=LS.get('garaj-data',{vehicles:[],records:[]});S.vehicles=d.vehicles||[];S.records=d.records||[];if(window.__OCR){SAMPLE={ocr:true}}}
  S.ready=true;render();if(N){const st=await notifPermission(true);if(st==='granted')scheduleNotifs()}}
render();boot();
}
