name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk AvtoTefter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AvtoTefter-apk
          path: AvtoTefter.apk
      - name: Publish download link (release "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: АвтоТефтер – тестова версия
          body: Свалете AvtoTefter.apk на телефона и го инсталирайте.
          files: AvtoTefter.apk
          make_latest: true
